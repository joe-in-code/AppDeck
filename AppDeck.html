  let mi=0,mcs=[];const markMi=()=>[...mn.children].forEach((b,k)=>b.classList.toggle('on',k===mi)),hideMn=()=>{mn.style.display='none';mcs=[]};
  const pick=c=>{inp.value=inp.value.replace(/@\w*$/,'@'+tok(c)+' ');DRAFT[inp.dataset.draft]=inp.value;hideMn();inp.focus()};

      if(e.key==='Tab'||e.key==='Enter'){e.preventDefault();pick(mcs[mi]);return}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();hideMn();return}}

  spl.onpointerdown=e=>{e.preventDefault();const sy=e.clientY,h0=ib.offsetHeight,mx=Math.max(80,(d.clientHeight||400)*.6);const mv=ev=>{const h=Math.min(mx,Math.max(44,h0+sy-ev.clientY));ib.style.height=h+'px';D.ih=h},up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);save()};addEventListener('pointermove',mv);addEventListener('pointerup',up)};

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;   /* dictation uses the browser's own speech service */
  let want=false,fails=[];const ph=inp.placeholder,MICGAP=300;

  /* The browser ends a recognition session after a quiet gap or about a minute; while the mic is on we start a new one and keep the text so far */

    const r=new SR();rec=r;r.continuous=true;r.interimResults=true;r.maxAlternatives=1;r.lang=navigator.language||'en-US';
    let base=inp.value,fin='',lastSet=null;

    r.onresult=e=>{if(!inp.isConnected){micOff();return}

      if(er==='no-speech'||er==='aborted')return;   /* quiet gap: onend starts a new session */

const MVP={"ver": "0.22.0-m5", "cards": [{"type": "assistant", "title": "Assistant", "data": {"mode": "plan", "m": []}, "pane": 0}, {"type": "note", "title": "Latest iteration", "data": {"text": "AppDeck 0.22.0-m5: response to your latest message\n\nM4 is closed (all cards built). M5 hardening starts here. This is slice M5.1.\n\nBUILT NOW (D94 to D100)\n- Safari fix: older Safari could not load the file at all because of a regex feature in the Markdown parser. Removed, with a test.\n- Files you open are size-limited (workspaces, cards, rows, text), so a bad file cannot freeze the tab.\n- CSV export no longer lets cells like =HYPERLINK(...) run as formulas when opened in a spreadsheet.\n- A Content-Security-Policy and no-referrer setting. If anything stops working (fonts, a custom model server), tell me and I will adjust it.\n- Keyboard: Menu > Card > Move to\u2026 (or the palette) moves a card to any pane without dragging. Card tabs and pane dividers can be focused and used with the keyboard. Screen reader labels, focus outlines, reduced motion.\n- The assistant is told that card text is data, never instructions.\n- Smoke runner for developers: appdeck-smoke.js.\n\nSTILL TO DO IN M5\n- A real browser matrix pass (Chrome, Edge, Firefox, Safari) and a screen-reader pass: these need you, I cannot run them.\n- Narrow-screen layout for the four-pane Workbench; touch alternatives to dragging.\n- Speech to text phase 2 (flag, off by default); self-host Inter; cap @all; assistant regression tests; tab reordering.\n\nPLEASE CHECK\n1. Menu > Help > Run tests (93/93 expected).\n2. Open the page in Safari or Firefox if you can, and tell me what differs.\n3. Click a card, then Menu > Card > Move to\u2026 and move it.\n4. Tab to a divider and press the arrow keys; press Ctrl/Cmd+Z.\n"}, "pane": 0}, {"type": "note", "title": "Product and locked decisions", "data": {"text": "PRODUCT\nAppDeck is a card-based workspace in a single HTML file. Core promise: a small set of cards that behave like the apps people already know, arranged in a split-pane workspace, with an assistant that can read and edit the workspace on request.\n\nLOCKED DECISIONS\n- Layout: split-pane tree. `Split{dir,sz[],ch[]}` or `Pane{cs[],a}`. Cards live in leaves; several cards in one pane show as tabs.\n- Drag and drop: drag a tab to a pane. Center or tab strip adds as a tab; top/bottom/left/right split the pane. Keyboard alternative (\"Move to\u2026\") required. Layout changes are undoable.\n- Cards for 1.0: Note, Markdown, List, Table, Tasks, Calendar, Calculator, Image, plus Assistant.\n- Cut: Web card, Library card, Properties card, fixed grid / merge / span geometry.\n- Assistant modes: Ask (no workspace context sent), Plan (reads chosen cards, proposes actions with diff preview, applied on approval), Create (applies actions directly, undoable). Default: Ask.\n- Providers: Anthropic, Gemini, OpenAI-compatible with custom base URL. Keys stay local and are never exported. Actions via tool calling, validated against card schemas.\n- Look: neutral surfaces, SVG icons, Inter (self-hosted for the offline build) plus a mono font, neutral blue accent, light/dark following the system, design tokens, hover-revealed controls, slim top bar, command palette (Ctrl/Cmd+K).\n- Data: `.appdeck` format with lossless per-card JSON, no API keys. Autosave to IndexedDB. One `commit()` path for autosave, undo and dirty-marking. Card content is kept apart from layout history."}, "pane": 0}, {"type": "table", "title": "Milestones", "data": {"g": [["#", "Scope", "Status"], ["M1", "Shell and workspace: tokens, top bar, command palette, split-pane engine, drop-zone drag and drop, pane tabs, layout undo", "Done and accepted. File: `appdeck-0.5.0-m1.html`"], ["M2", "Data core: card registry with schemas, `commit()`, IndexedDB autosave, `.appdeck` format, round-trip tests", "Done and accepted. File: `appdeck-0.6.0-m2.html` (9/9 in-page tests pass in browser)"], ["M3", "Assistant: adapters, Ask/Plan/Create, tool-call actions, diff preview, @-mentions, streaming", "Done and accepted. File: `appdeck-0.7.5-m3.html`"], ["M4", "Cards in order: Table, Tasks, Note/Markdown, Calendar, List, Calculator, Image", "Built, awaiting acceptance. 4.1 Table, 4.2 Tasks, 4.3 Markdown, 4.4 rich-text Note (ProseMirror), 4.5 Minimize-to-dock, 4.6 Global search, 4.7 Archive + Card catalog, 4.8 Menu system built: `appdeck-0.21.0-m4.html` (0.17.0 passed 72/72 in browser; 0.18.0-m4 passed 78/78 in Chromium). 4.11 Calendar and 4.12 Calendar repeats and .ics import and export built. 4.13 List card built (0.19.0-m4; 81/81 in browser). 4.14 Calculator built (0.20.0-m4; 85/85 in browser). 4.15 Image built (0.21.0-m4; 88 tests expected). All M4 cards built and accepted"], ["M5", "Hardening: sanitization, accessibility, browser matrix, e2e smoke tests", "In progress. M5.1 built: `appdeck-0.22.0-m5.html` (93 tests expected): load limits, CSV injection, CSP, Safari-safe Markdown, keyboard Move to\u2026, accessibility basics, headless smoke runner. Remaining: browser matrix and screen-reader pass (with you), narrow-screen layout, touch alternatives, speech to text phase 2, self-host Inter, @all cap, assistant regression tests."]]}, "pane": 1}, {"type": "table", "title": "Familiar app checklists", "data": {"g": [["Card", "Model", "Must have"], ["Note", "Apple Notes / Keep", "Rich text, checklists, links, `/` menu, paste images, autosave. Use a real editor, not `execCommand`."], ["Markdown", "Obsidian / Typora", "Live preview, code highlight, clickable checkboxes, tables, sanitized output. Consider merging with Note."], ["List", "Apple Reminders", "Complete, nest, reorder by drag, collapse, clear completed."], ["Table", "Sheets / Excel", "Selection, formulas (`=SUM` etc.), TSV paste, column types, sort/filter, frozen header, fill-down, CSV in/out."], ["Tasks", "Trello / Linear", "List and board views, drag between statuses, priority, due, assignee, saved filters."], ["Calendar", "Google Calendar", "Month/week/day with time grid, drag to create and resize, recurrence, ICS in/out."], ["Calculator", "iOS Calculator", "Keyboard input, history, safe parser (no `Function()`), optional scientific mode."], ["Image", "Preview / Photos", "Zoom/pan, rotate, gallery, paste/drag in, download."]]}, "pane": 1}, {"type": "table", "title": "Decision log", "data": {"g": [["#", "Milestone", "Decision", "Why"], ["D1", "M2", "One `commit()` path: history, dirty mark, autosave, render. Card content stays outside layout history.", "Lessons: undo gaps, silent storage failure."], ["D2", "M2", "`.appdeck` v1 is canonical JSON per card; keys scrubbed on write and read; loader repairs bad files.", "Lessons: keys in exports, lossy save."], ["D3", "M3", "Provider settings and keys live in their own IndexedDB record, never in state or exports.", "Keys never leave the browser."], ["D4", "M3", "Typed tools (`set_note`, `set_tasks`, `set_table`, `add_card`, `close_card`, `rename_card`), validated against card schemas and live cards.", "Safer than a generic data blob; Gemini rejects empty object schemas."], ["D5", "M3", "AI actions put card content into the undo snapshot; normal typing stays outside undo.", "Create mode must be undoable."], ["D6", "M3", "New cards never land in the assistant pane; if no other pane exists, one is split off.", "User feedback."], ["D7", "M3", "After an apply: toast, tab dot, banner, changed rows/cells highlighted.", "User feedback: show what the assistant touched."], ["D8", "M3.1", "Plan/Create send a title-only card index for all cards; contents only for `@mentioned` cards (`@all` = every card). Approved by user.", "Lets the model update instead of duplicating, without reading everything."], ["D9", "M3.1", "`set_*` is rejected unless the card's contents were shared; duplicate adds flagged; Plan proposals flag cards edited since proposed (\"Apply anyway\").", "No blind overwrites; drift guard."], ["D10", "M3.2", "Cards are referred to as `<type>-<title>-<id>` in model context; chat text shows titles only; unshared cards the model asks for get a \"Share and retry\" button.", "User feedback: ids are not human-friendly."], ["D11", "M3", "Single model round per message (no tool-result loop).", "Superseded by D12."], ["D12", "M3.3", "`@mentions` are optional. In Plan/Create the model sees the title-only index and calls `read_cards` for what it needs (max 2 rounds; contents return as plain text, so all providers behave alike). Reads are shown under the reply (\"Read: \u2026\"). Ask still sends no workspace context. `set_*` needs a card to have been read. Approved by user.", "The model should find relevant cards by reasoning, not by user syntax."], ["D13", "M3.3", "\"Check consistency\" uses a `report_inconsistency` tool, once per finding. Cards get an amber tab badge, a banner listing findings, highlighted rows/cells where a quote matches; chat lists each finding with go-to buttons, \"Propose fixes\" (hands off to Plan) and \"Clear flags\". A card can carry several findings. Notes show quotes in the banner only.", "User feature request: visible, multi-finding consistency check."], ["D15", "M4.1", "Table formulas use an own tokenizer/parser (`+ - * / ^`, parentheses, A1 refs, ranges, `SUM AVG MIN MAX COUNT ABS ROUND`); no `eval`/`Function`. Errors show `#DIV/0 #CYCLE #REF #NAME #VALUE #ERR`. Raw formulas are stored; values are computed.", "Lesson: safe parser."], ["D16", "M4.1", "Table schema is `{g, types[]}` (text/number per column). Structural edits (sort, add/delete row or column, paste, fill-down, clear, CSV import, type change) go through `commit` with content history, so they are undoable; typing stays outside undo.", "Consistent with D5."], ["D17", "M4.1", "Sort rewrites a formula's references to its own row; deleting rows or columns does not rewrite references. Filter is a view only. Frozen header and A/1 gutter labels give the formula references.", "Known limits, listed in backlog."], ["D18", "M4.1", "Assistant gets `append_rows` and `update_cell` (A1) for small table edits; both need the card to have been read and show a diff.", "Fewer rewrites, exact change markers."], ["D19", "M4.1", "Table row/column actions live on the grid, not the toolbar: a `+ Add row` bar under the last row, a `+` header after the last column, and hover controls on each column letter (sort toggle \u2195/\u25b2/\u25bc, \u2715 delete) and row number (\u2715 delete). Deleting with a full row or column range selected removes the whole range. Controls stay visible for the selected row/column (touch). Toolbar keeps column type, filter and CSV.", "User feedback: more intuitive, standard spreadsheet UX."], ["D20", "M4.1", "Deleting rows/columns is two-step: click a row number or column letter (shift-click extends), then press Delete/Backspace or click the \u2715, which only appears on a selected header. A toast says how many were deleted. Delete on a cell range clears contents.", "User feedback: \u2715 was too easy to hit by accident."], ["D21", "M4.1", "Cell ranges: drag, shift-click, shift-arrows, column/row headers, corner = all. Ctrl/Cmd+C/X/V work on ranges (TSV, so spreadsheets interoperate); a dashed outline marks the copied range; Esc clears it. Pasting a copied range shifts formula references like a spreadsheet; one value pasted over a range fills it.", "User feature request."], ["D22", "M4.1", "Row/column delete no longer has an inline \u2715. Selecting a header shows a `\u22ef` menu (Delete N rows/columns in red, Clear contents), or press Delete; every delete shows a toast with an Undo button (7 s).", "User feedback: the \u2715 was still too easy to hit."], ["D23", "M4.1", "`render()` saves and restores scroll positions (card body, assistant messages, tab strip, note text) per pane; Tasks keeps its scroll when redrawn; the assistant sticks to the bottom only if you were already there.", "Bug: scroll snapped to the top after any re-render."], ["D24", "M4.1", "Workspaces can be renamed and deleted from a `\u22ef` button on the active tab, right-click on a tab, or the palette. Delete asks for confirmation (shows the card count), keeps at least one workspace, and offers Undo in a toast. Workspace tab reordering stays in the backlog.", "Pulled forward from backlog by user request."], ["D25", "M4.1", "Typing in card fields (table cells, notes, task text, checkboxes, adding/removing a task) is now undoable: one snapshot per burst of typing in the same field (under 1 s apart), taken before the edit. Ctrl/Cmd+Z and Shift+Z work while a card field has focus; other inputs (assistant message, palette, rename) keep native undo. Supersedes the \"typing stays outside undo\" part of D5/D16.", "User report: undo/redo not functioning (the toolbar stayed greyed out after edits); legacy lesson \"undo gaps\"."], ["D26", "M4.1", "Default layout is Workbench: assistant (main) on the left, two panes top right, one bottom right. It is the first-run workspace, every new workspace (with an Assistant card in the main pane and three empty panes), and a palette preset.", "User feature request."], ["D27", "M4.1", "Junction anchors: a handle sits where a vertical and a horizontal divider meet (T or +, including aligned dividers in different splits); dragging moves all of them together, double-click evens them out; undoable. Geometry is read from the rendered dividers.", "User feature request."], ["D28", "M4.1", "Table column and row headers show a `\u25be` menu on hover (no selection needed): column: sort A\u2192Z / Z\u2192A, type, insert left/right, clear, delete (red); row: insert above/below, clear, delete (red). The `\u2195` one-click sort toggle stays.", "User feature request."], ["D29", "M4.1", "Workspace rename uses an inline text box (double-click a tab, `\u22ef` menu, right-click, or palette), not `contentEditable`, so it works in every browser.", "User feature request (rename existed; made reliable)."], ["D30", "M4.1", "The table column `\u25be` menu sits at the right edge of the header, apart from the letter and the sort toggle.", "User feedback."], ["D31", "M4.1", "Junction anchors are hidden until hovered (like the divider highlight); while dragging, the anchor follows the pointer.", "User feedback."], ["D32", "M4.1", "A built-in AppDeck MVP workspace holds the brief as cards (Assistant, Latest iteration, Product and decisions, Milestones, Familiar-app checklists, Decision log, Backlog, Known gaps, Working agreements, Lessons). It is generated from this brief at build time and re-synced once per app version (tracked in its own IndexedDB record); edits to those cards are replaced on the next version. If the workspace is deleted it comes back on the next version.", "User request: keep the project docs and each iteration's response inside the app."], ["D33", "M4.1", "Saved workspaces live in IndexedDB per browser and origin, so a new build opened in the same browser shows the old workspaces; this is autosave, not a cache bug. New palette commands: Export workspace as Markdown (for sharing context with Claude Code or this project) and Reset all workspaces to a fresh sample (asks first; provider settings are kept).", "User question about stale tabs; support for the iteration loop."], ["D34", "M4.2", "Tasks schema is `{l:[{t,d,s,p,due,who}],view,sf}`: status `todo/doing/done` (fixed set; `d` mirrors done), priority 0-3, due `YYYY-MM-DD`, assignee text, view `list/board`, saved filters. Old `{t,d}` data upgrades on load.", "Brief: Trello/Linear model."], ["D35", "M4.2", "List and Board views. Board cards move by dragging the `\u22ee\u22ee` handle (HTML5 drag) onto a column (append) or a card (insert before); every task also has a `Move to\u2026` menu, which is the touch fallback. Search, priority, assignee, hide-done and order are per-card view state (not saved); named filters are saved on the card.", "Drag between statuses, saved filters."], ["D36", "M4.2", "Enter adds a task below, Backspace on empty text deletes it, and the `\u22ef` menu has Delete (red) with an Undo toast. All structural task edits are undoable; text edits join the typing undo.", "Consistent with D22/D25."], ["D37", "M4.2", "Assistant: `set_tasks` takes status, priority, due and assignee; new `append_items` and `update_item` (1-based index, only passed fields change); diffs and change markers show per-item changes.", "Small edits, exact markers."], ["D38", "M4.2", "Toolbar, search and add inputs no longer create typing-undo steps (this also fixes the Table filter box).", "Bug found while building Tasks."], ["D39", "M4.2", "Tasks views are Task List, Board and Report (the plain checkable List card with sub-items stays a separate card). Priority shows a symbol as well as a colour: \u25b2 high, \u25c6 medium, \u25bd low, \u25cb none.", "User feedback."], ["D40", "M4.2", "Report view: priority bars, a status donut and an executive summary (overview, status, overdue, due in 7 days, open high priority, workload, next up). It follows the current filters, is computed from the card with no AI call, and has a Copy button.", "User feature request."], ["D41", "M4.2", "A maximized pane stays maximized across undo and redo (it only resets if that pane no longer exists).", "Bug report."], ["D42", "M4.2", "Cards can be renamed by double-clicking the tab, right-click, or the palette command \"Rename active card\"; renaming is undoable.", "User request."], ["D43", "M4.2", "Workbench placement by type, for net-new cards only: Notes go to the top-right-left pane, Tasks to the top-right-right pane, Tables to the bottom-right pane; other types go to whichever top-right pane holds fewer cards. Panes are found by position in the layout tree. If the layout no longer has the Workbench shape, or the target pane holds the assistant, the old rule applies (focused pane without the assistant). Editing, renaming or moving a card never re-places it.", "User feature request (was under review)."], ["D44", "M4.3", "Locked card list changed (approved by user): Note and Markdown stay two cards. Note becomes a real rich-text editor (4.4); Markdown is a source-plus-preview card.", "User chose option B."], ["D45", "M4.3", "Markdown renderer is our own parser that builds DOM nodes: no `innerHTML`, no raw HTML pass-through, links limited to `http(s)` and `mailto`, images not loaded. Supports headings, emphasis, strike, inline code, links and autolinks, quotes, rules, nested ordered/bullet/task lists, pipe tables with alignment, fenced code with light highlighting (js/ts/json, python, shell/yaml, sql, css).", "Lesson: XSS; checklist: sanitized output."], ["D46", "M4.3", "Markdown card has Edit, Split and Preview modes. Preview checkboxes toggle the `[ ]`/`[x]` in the source (undoable). In the editor: Enter continues lists and tasks, Tab/Shift+Tab indent list lines, Ctrl/Cmd+B and +I wrap the selection.", "Familiar-app checklist."], ["D47", "M4.3", "Assistant: `set_markdown` and `append_text` (works for Note and Markdown); `add_card` accepts `markdown`. Markdown cards have no default Workbench pane, so they land in whichever top-right pane holds fewer cards. Tests now run in jsdom (a real DOM) instead of the old stub.", "Small edits; exact markers."], ["D48", "M4.3", "Unsent text in draft boxes (assistant message, add-task) is kept in memory per card across re-renders, card switches and workspace switches. It is not saved to disk, so it is lost on reload.", "Bug report: draft lost on focus change."], ["D49", "M4.3", "The @card list is keyboard-driven: Up/Down moves, Tab or Enter picks, Esc closes. The first match is preselected.", "User feature request."], ["D50", "M4.2", "Tasks gain `sum` (one-line summary, up to 200 characters) and `desc` (details, up to 5000). The summary shows under the title in Task List and Board; search matches title, summary and details; the assistant can set `summary` and `details`. Assumption to confirm: \"summary field\" was read as a per-task field, not a card-level summary.", "User feature request."], ["D51", "M4.2", "Detail tab: a task list on the left (follows filters and order) and a form on the right (title, summary, status, priority, due, assignee, details, Actions menu with a red Delete and Undo toast); `+ New task` focuses the title.", "User feature request."], ["D52", "M4.5", "Minimize: each card has a minimize button on its tab (also right-click and the palette). A minimized card leaves its tab strip and becomes a chip in a dock under the workspace, shown only while something is minimized; click the chip to restore it to its pane. It keeps its content, stays in its pane (an all-minimized pane shows a hint), and stays visible to the assistant. Undoable; saved as an optional `min` flag. Palette: Minimize active card, Restore all minimized cards.", "User feature request."], ["D53", "M4 (assistant UX)", "Every assistant change has its own \u2713 and \u2717, in the chat and in the card banner. In Plan mode \u2713 applies and \u2717 discards that change; once applied (Plan or Create) \u2713 keeps it and \u2717 reverts just that change from a stored inverse. `\u2713 All` and `\u2717 All` act on every pending change, or on every applied one if none are pending. Reverting is undoable (toast Undo) and asks first if the card was edited after the assistant changed it. The old whole-proposal Apply/Discard buttons and the \"Apply anyway\" step are replaced by these (a changed-since-proposed card now asks for confirmation). Limit: reverting a closed card whose pane has since disappeared puts it in the default place.", "User feature request."], ["D54", "M4 (assistant UX)", "Assistant layout: messages on top; modes, settings and the mode note sit in a bar above the input; the input is multi-line (Enter sends, Shift+Enter adds a line) and a draggable divider above it resizes it (height saved per assistant card, double-click resets).", "User feature requests."], ["D55", "M4 (assistant UX)", "Dictation: a microphone button uses the browser's built-in speech recognition and writes into the message box. It is not available in browsers without it (for example Firefox). Privacy: Chrome sends the audio to Google's speech service; AppDeck tells you once per session.", "User feature request."], ["D56", "M4.2", "The list/form divider in the Tasks Detail tab is draggable (width saved with the card, double-click resets). Assumption: \"Details horizontal divider\" meant this divider.", "User bug report."], ["D57", "M4.6", "Global search: Ctrl/Cmd+Shift+F, the top-bar document-search button, or the palette command. It searches every workspace (or just this one) for words in card titles, Note and Markdown text, task title, summary, details and assignee, table cells, and assistant chats. All typed words must appear in the same line, task or cell. Results are grouped by card with highlighted snippets; Up/Down and Enter work; picking one switches workspace, restores a minimized card, activates it and scrolls to and highlights the match (it clears task filters and the table filter first). It is a jump list, not a filter that dims cards.", "User feature request."], ["D58", "M4.7", "User decisions recorded: rich-text Note uses ProseMirror (bundled into the file); Close archives a card; the menu system is one Menu button. The Menu button touches the locked \"slim top bar\" and is approved.", "User decisions."], ["D59", "M4.7", "Close (tab \u2715, tab menu, the assistant's `close_card`) now archives: the card keeps its content but leaves its pane, and remembers its pane. Delete permanently\u2026 (tab menu, catalog) is separate: it asks first and deletes the card and its data. Archived cards are invisible to the assistant (card index, `@mentions`, `@all` and tools), are skipped by layout presets, and are not re-homed when a file is loaded; they are searchable (global search restores one when you open it) and saved in `.appdeck` as `arch` plus the pane it came from.", "User decision."], ["D60", "M4.7", "Card catalog (palette \"Card catalog\u2026\" or Ctrl/Cmd+Shift+L): every card in every workspace with type, workspace and a status dropdown (Active, Minimized, Archived); filter by text, status or \"this workspace only\"; sort by any column; \u22ef menu: Go to card (restores archived), Rename, Delete permanently. Changes in the current workspace are undoable; in another workspace they apply immediately without undo. Restoring an archived card puts it back in its old pane if that pane still exists, otherwise the Workbench placement rules apply.", "User feature request."], ["D61", "M4.8", "One Menu button on the top bar (left of the workspace tabs) opens a two-column menu: groups File, Edit, View, Card, Workspace, Assistant, Help on the left, items on the right with shortcuts shown (\u2318 on Mac). Hover or click a group; Up/Down/Left/Right, Enter and Esc work; unavailable items are greyed (Undo with no history, card actions with no card selected, Delete workspace with one left); destructive items are red. No always-visible menu bar, so the slim top bar stays.", "User decision D58."], ["D62", "M4.8", "Menus and the command palette share one command list (`CMD`, one entry per command, with optional shortcut, menu label and enabled check). The palette is built from it plus the Go to cards, so they cannot drift. New palette commands: Archive active card, Delete active card permanently\u2026, Keyboard shortcuts. Tests check that every menu entry names a defined command and that the palette lists every command once.", "Brief: menus share one command list with the palette."], ["D63", "M4.4", "Note data model: `text` (a Markdown dialect: one newline is a line break, a blank line starts a paragraph) is the canonical content; `imgs` holds the pictures the text refers to as `![alt](img:ID)`; `doc` is an optional editor cache that is used only while it still equals what the text would produce. Plain notes from earlier versions open unchanged. The assistant, search, export and the diff view keep working on `text`; an assistant edit simply makes the cache stale and the editor rebuilds from the text, and `set_note` keeps pictures whose `img:` tag is still in the new text.", "Lesson: lossless save. Keeps one canonical, readable form for every consumer."], ["D64", "M4.4", "Editor (ProseMirror, bundled into the file): toolbar (bold, italic, strike, code, link, H1, H2, bullet, numbered, checklist, quote, code block, image), `/` menu (Text, Heading 1-3, lists, checklist, quote, code block, divider, image), Markdown shortcuts while typing (`# `, `- `, `1. `, `[] `, `> `, three backticks, `bold`, `*italic*`, `~~strike~~`, `` `code` ``), Ctrl/Cmd+B, I, E, Shift+X, Tab and Shift+Tab to indent lists, click a checkbox to tick it, Shift+Enter for a line break. Links are added from the toolbar (Ctrl/Cmd+K stays the command palette); pasting a URL over selected text makes a link; Ctrl/Cmd-click opens a link.", "Brief: Note checklist (rich text, checklists, links, `/` menu, paste images, autosave, a real editor)."], ["D65", "M4.4", "Pictures can be pasted, dropped or picked from the toolbar. They are shrunk to 1200 px, kept under about 1.5 MB, and stored inside the card as data URLs (PNG, JPEG, GIF as still image, WebP). Remote images are never loaded.", "Offline single file; lesson: XSS and privacy."], ["D66", "M4.4", "Safety: the editor schema is the only way content gets in. Pasted HTML is parsed through the schema (scripts, styles, event handlers, unknown tags dropped); links are limited to `http`, `https` and `mailto`; images to PNG, JPEG, GIF and WebP data URLs; nothing is set with `innerHTML`. Tests cover hostile Markdown and HTML.", "Lesson: XSS; checklist: sanitized output."], ["D67", "M4.4", "Undo: inside a Note, Ctrl/Cmd+Z and Y use the editor's own history, which keeps the cursor and selection; the toolbar Undo steps back typing bursts like other cards (one snapshot per burst, which now includes pictures). Any re-render rebuilds the editor, restores the selection and focus, and starts a fresh editor history.", "Consistent with D25; editing feels native."], ["D68", "M4.4", "Search: a hit inside a Note now selects the match in the editor. Fix: pressing Enter in the search box re-ran the query and reset the highlighted row to the first one, so Enter after Up/Down opened the wrong result; it now re-runs only if the text changed since the last run.", "Bug found while testing 4.4."], ["D69", "M4.4", "Packaging: the editor module (`note.js`) is bundled with esbuild (`--bundle --minify --format=iife --global-name=PMX --target=es2019`) from ProseMirror model 1.25, state 1.4, view 1.42, transform 1.12, commands 1.7, schema-list 1.6, history 1.5, inputrules 1.5, keymap 1.2, dropcursor and gapcursor, and inlined into the HTML. The module source is embedded in the file in a `<script type=\"text/plain\" id=\"src-note\">` block, so the single file carries everything needed to rebuild it. The file grows by about 300 KB.", "Single-file rule; the build file alone is enough to resume."], ["D70", "M4", "Rename by double-click: card tabs already had a double-click handler, but the first click redrew the tab strip, so the browser never delivered the double-click and nothing happened. Two quick clicks on a tab (within 450 ms) now open the name box directly. Enter or clicking away saves, Escape cancels. Tests cover a quick pair and a slow pair.", "Request from user; bug in an existing feature."], ["D71", "M4 (assistant UX)", "Dictation, phase 1: while the microphone is on, the browser ending its session (a quiet gap or about a minute) no longer stops dictation. A new session starts after 0.3 s and the text so far is kept. Quiet-gap errors are ignored; a missing permission, no microphone or no network stops it with a clear message; five restarts in five seconds stops it too. If you type, edit or send while dictating, your text is kept and dictation continues after it. The message box shows 'Listening\u2026' and the mic button turns red.", "Request from user; builds on D55."], ["D72", "M4 / M5", "Placement of feature requests (your rule: Claude places fixes and features). Rename by double-click: M4, built in 0.16.1-m4. Speech to text, phase 1 (keep listening, keep edits, clear listening state): M4, built in 0.16.1-m4. Speech to text, phase 2 (record audio and transcribe it through a provider that offers transcription, for a result closer to Claude Chat: handles pauses, no browser time-outs, level meter, optional hold-to-talk): M5, behind a flag that is off by default. It sends audio to the provider you chose, so the privacy note applies; providers without transcription (Anthropic) keep using the browser dictation.", "User rule: place fixes and features in the fitting milestone."], ["D73", "M4.11", "Calendar data: each event has a short stable id, title, start date, end date, start and end time, all-day flag, location, notes and one of six colors. Dates are local YYYY-MM-DD and times local 24-hour HH:MM, with no time zones in this slice. A timed event stays inside one day; an all-day event can span days. Events are kept in date and time order. The card also stores its view (month, week or day), the date in focus and whether weeks start on Sunday or Monday. Bad dates, times and colors are repaired or dropped when loading.", "Brief: Calendar card; lesson: lossless save and schema validation."], ["D74", "M4.11", "Views and gestures. Month: 6 by 7 grid, up to 3 events per day, '+N more' opens that day. Week and Day: 24-hour grid (44 px per hour, 15-minute snap, red now-line, opens at 7 AM), overlapping events sit side by side. Drag on an empty slot to create (a click makes a 1-hour event), drag an event to move it across days and times, drag its bottom edge to resize, click it to open the editor (title, all day, dates, times, location, notes, color, delete). Month: click a day to add an all-day event, drag an event to another day. Touch: tap only (tap a slot to add, tap an event to edit). Keyboard: events are buttons (Enter opens the editor), '+ Event' adds one, the editor edits every field. Every gesture is one undo step.", "Brief: month/week/day, time grid, drag to create and resize."], ["D75", "M4.11", "Assistant: new tools add_events, update_event, delete_event and set_events (and add_card with type 'calendar'). Events carry their id in square brackets in the card text; the model reads them as plain fields (title, date, start, end, all_day, location, notes, color). Dates must be YYYY-MM-DD and times HH:MM or the action is refused; adding only invalid events is refused. The system prompt now states today's date. Changed events get a gold outline until you keep or revert the change.", "Contracts first: validate every action against the card schema."], ["D76", "M4.11", "Search finds event titles, locations, notes and dates; picking a hit jumps to that month and flashes the event. Markdown export lists events by date. A new Calendar card is placed in the bottom pane of the Workbench layout.", "Consistent with D58 to D60."], ["D77", "M4.11", "Left for M4.12: repeating events, ICS import and export, multi-day events drawn as one bar across days, dragging across days in Month to create a multi-day event, reminders, time zones.", "Keeps the slice small."], ["D78", "M4.12", "Repeating events: daily, weekly on chosen weekdays, monthly on the same date, yearly; every 1 to 99 units; ends never, on a date or after a number of times; a list of skipped dates. A month without that date (the 31st) and a non-leap 29 February are skipped. Occurrences are worked out on the fly for the dates on screen, so a series costs almost nothing to store.", "Brief: Calendar recurrence."], ["D79", "M4.12", "Editing repeats: the editor changes the whole series by default; 'This event' turns that date into a one-off copy (the series skips it). Dragging or resizing one occurrence does the same. 'Delete this' skips one date, 'Delete all' removes the series. Changing the date in the editor moves the whole series. Repeating events show a repeat arrow in Month and Week.", "Same model as common calendar apps, with fewer prompts."], ["D80", "M4.12", "Assistant: add_events, update_event and set_events accept a repeat rule (freq, interval, days, until or count; freq 'none' removes it). Card text shows a plain summary such as 'repeats every 2 weeks on tue,thu until 2026-08-01'.", "Contracts first."], ["D81", "M4.12", "Calendar files (.ics): export writes standard VCALENDAR 2.0 with local times, all-day dates, repeat rules, skipped dates, escaped and folded text, and a UID per event. Import (up to 3 MB) converts UTC and named time zones to your local time, understands durations and all-day events, skips cancelled events, turns changed occurrences into one-off events, ignores alarms, and skips events whose UID is already there, so importing the same file twice adds nothing. Not supported, imported as a single one-off event and counted in the message: rules such as 'first Monday of the month', lists of month days and similar. Overnight events are cut at 23:59. Event colors round trip. Reach it from the calendar's three-dot menu, Menu > File or the palette.", "Brief: ICS in and out."], ["D82", "M4.12", "Still open for the Calendar: nth-weekday monthly repeats, one long bar for multi-day events, drag across days in Month to create a multi-day event, reminders, a time zone per event, and a 3-day or automatic Day view in narrow panes.", "Backlog."], ["D83", "M4.13", "List data: a flat list of items {text, done, depth 0 to 3, collapsed}. Nesting comes from depth, and an item may be at most one level deeper than the item above it; bad data is repaired on load. Collapsed state is saved with the card.", "Apple Reminders model; one simple, lossless shape that is easy to reorder and validate."], ["D84", "M4.13", "List interactions: Enter adds an item below (after any nested items) at the same level; Enter on an empty indented item outdents; Tab and Shift+Tab indent and outdent the item with its nested items; Backspace on an empty item deletes it; arrow keys move between items; a triangle collapses children (a +N count shows). Ticking a parent does not tick its children. Clear completed removes ticked items (Undo toast). Drag the grip to reorder: nested items move with it, dropping on a row inserts before it at that row's level, dropping into its own children is ignored. The three-dot menu has Indent, Outdent, Move up, Move down and Delete, which is the keyboard and touch path. Every structural change is undoable.", "Brief: complete, nest, reorder by drag, collapse, clear completed."], ["D85", "M4.13", "Assistant: set_list (items with text, done, indent) and add_card with type list. The model sees a list as {items:[{text, done, indent}]}. Diffs and change markers work per item; global search finds list items (and expands collapsed parents to show the hit); Markdown export writes nested checkboxes.", "Contracts first; consistent with D37 and D57."], ["D86", "M4.13", "A new List card has no fixed Workbench pane; it lands in whichever top-right pane holds fewer cards. The List card (nested checklist) and the Tasks card (status, priority, due, board) stay separate cards.", "Keeps the placement rules simple; matches D39."], ["D87", "M4.14", "Calculator evaluation: an own tokenizer and recursive-descent parser; no `eval`, no `Function`. Operators + \u2212 \u00d7 \u00f7 and ^ (right-associative, so -2^2 is -4); % after a number divides by 100 (50% is 0.5; 200+10% is 200.1, not the iOS \"10% of 200\"); ! is factorial for whole numbers 0 to 170; parentheses up to about 100 deep; 300 characters at most. Functions sqrt, sin, cos, tan, asin, acos, atan, ln, log (base 10), abs, exp; names pi, e and ans (the last result). Typed or pasted \u00d7 \u00f7 \u2212 \u03c0 \u221a are understood. Unknown names, division by zero, domain errors and overflow give a short message. Results are rounded to 12 significant digits (0.1+0.2 shows 0.3).", "Lesson: safe parser; checklist: no Function()."], ["D88", "M4.14", "Calculator interaction: you type an expression in the display (or use the keypad, which inserts at the cursor); a live preview shows the result; Enter or = calculates, puts the result in the display and adds it to the history; Esc clears. Scientific mode adds sin, cos, tan, ln, log, \u221a, x\u00b2, x\u02b8, !, \u03c0, e and ans, with a Deg/Rad switch (default Deg; trig values within 1e-14 of zero show 0; tan of 90\u00b0 is Undefined). The expression text is view state (kept in memory, not saved). The last 100 history entries and the mode are saved with the card and are undoable; click a history row to insert its result; Clear history has an Undo toast.", "Brief: keyboard input, history, safe parser, optional scientific mode."], ["D89", "M4.14", "The assistant can read a Calculator's history but has no calculator tools in 1.0. Global search finds history entries; Markdown export lists them. A new Calculator card has no fixed Workbench pane; it lands in whichever top-right pane holds fewer cards.", "Keeps the assistant's tool list to cards it should edit; matches D86."], ["D90", "M4.15", "Image data: `{imgs:[{id, name, src, rot}], cur}`; up to 12 pictures per card. PNG, JPEG, GIF (stored as a still image) and WebP go in; they are shrunk to 1600 px and stored as PNG or JPEG data URLs under about 1.5 MB (a PNG stays PNG, and falls back to JPEG on a white background only if too large). Rotation (0, 90, 180, 270) is saved per picture and never changes the stored pixels. Anything that is not a safe image data URL is dropped when loading. Zoom and pan are view state and are not saved.", "Offline single file; lesson: lossless save, XSS."], ["D91", "M4.15", "Image interaction: add pictures from the toolbar, by paste (Ctrl/Cmd+V while an Image card is active), or by dropping files on the card. Mouse wheel zooms at the cursor, dragging pans, double-click toggles fit and 100%, and the toolbar has \u2212, +, Fit, 1:1, rotate left and right, previous and next, Download and Delete (Undo toast). Keys on the viewer: + \u2212 0, R and Shift+R, arrows (pan when zoomed, otherwise previous and next). Thumbnails show when there are two or more pictures. Download saves the picture with its rotation applied (rotated pictures are re-encoded as PNG, or JPEG for JPEG). Rotate, add and delete are undoable; switching pictures is not.", "Brief: zoom/pan, rotate, gallery, paste/drag in, download."], ["D92", "M4.15", "Undo snapshots no longer copy picture data: every `data:image/` string over 2000 characters is replaced by a reference to one shared copy, and put back when you undo or redo. This also fixes the Note image memory concern in the backlog (each undo snapshot used to copy every picture).", "Keeps undo cheap for picture-heavy workspaces."], ["D93", "M4.15", "The assistant sees an Image card only as names and rotation, never pixels (keeps requests small and private). Global search finds picture names and jumps to the picture; Markdown export lists the names. Menu > File has Add pictures to Image card and Download current picture. A new Image card has no fixed Workbench pane; it lands in whichever top-right pane holds fewer cards.", "Privacy and size; matches D86."], ["D94", "M5.1", "Limits on loaded data: files over 200 MB are refused; at most 50 workspaces, 300 cards per workspace, 5000 tasks or list items per card, tables of 1000 rows by 100 columns, 10,000 characters per cell, 1,000,000 characters per note, titles of 200 characters (workspace names 60). Anything beyond is dropped on load.", "Hostile or corrupted files must not freeze or exhaust the tab."], ["D95", "M5.1", "Table CSV export neutralises spreadsheet formula injection: a text cell starting with = + - or @ that is not a plain number gets a leading apostrophe. Numbers such as -5 are unchanged.", "Backlog item from M4.1 (sanitization)."], ["D96", "M5.1", "A Content-Security-Policy is set in the file: no external scripts, frames, forms or objects; images only from data: and blob:; styles and fonts only from Google Fonts; network requests only over http or https (custom provider URLs must keep working); no referrer is sent. 'unsafe-inline' stays for scripts and styles because the app is one file, so this limits what a bug could load or send, not what inline code can do.", "Defence in depth for a single-file app."], ["D97", "M5.1", "Browser compatibility: the Markdown parser no longer uses regex lookbehind, which made Safari before 16.4 refuse to load the whole file; a test scans the file for it. Target for the matrix: the current and previous major versions of Chrome, Edge, Firefox and Safari 16.4 or later. Dictation needs a browser with speech recognition (not Firefox).", "Browser matrix; one syntax error breaks everything."], ["D98", "M5.1", "Keyboard and screen readers: Card > Move to\u2026 (also in the palette) lists every pane as a target (as a tab, or a new pane left, right, above or below) and fulfils the locked keyboard alternative to dragging. Card tabs are focusable (Enter or Space selects, F2 renames, arrows move between tabs); dividers are focusable (arrow keys resize in 3% steps, undoable); the toolbar, panes, tab list, tabs, palette and toast have roles and labels; keyboard focus outlines show; animations stop when the system asks for reduced motion.", "Locked decision: keyboard alternative required; accessibility milestone."], ["D99", "M5.1", "Prompt-injection guard: the assistant's instructions say that text inside cards is data and never instructions. The existing protections stay: every action is validated against the card schema, Plan mode needs approval, and every applied change can be reverted one by one.", "Cards can contain imported or pasted text."], ["D100", "M5.1", "Headless smoke runner `appdeck-smoke.js` (Node with jsdom and fake-indexeddb): loads the build, runs the in-page suite, then boots, adds every card type, undoes and redoes everything, round-trips every workspace through the .appdeck format, searches and resets. Two calendar tests need a layout engine and are skipped under jsdom; they still run in the browser.", "Brief: e2e smoke tests."], ["D14", "process", "The user allows fixes, features and issues to be placed in the current or a future milestone at Claude's discretion.", "Keeps milestones coherent."]]}, "pane": 2}, {"type": "note", "title": "Backlog and open questions", "data": {"text": "M4 (cards): real Table, Tasks, Note/Markdown, Calendar, List, Calculator, Image. Patch-style assistant tools (`append_rows`, `update_cell`, `append_items`, note find/replace) so edits are small and diffs and markers become exact. Table formulas keep totals inside one card. Changed-line highlight in notes needs the real editor.\n\nM4.1 follow-ups: narrow-screen fallback for the 4-pane Workbench (M5); anchors can overlap a pane's tab buttons when a junction is dragged to the very top; rewrite formula references on row/column delete; drag-select and column resize; column formats (currency, percent, date); checkbox column type; CSV export should neutralise values starting with `=` for spreadsheets (M5 sanitization).\n\nM4.3 follow-ups: scroll sync between source and preview; images and wiki-links; an outline panel; export a Markdown card as `.md`.\n\nM4.2 follow-ups: AI-written executive summary option, report export (image/PDF), chart by assignee; the List card (nested checklist) is a separate M4 card; touch drag for the Board; custom statuses; reorder by drag in List view; recurring tasks and reminders.\n\nM5 (hardening): cap or chunk `@all`; mock-model tests for update-versus-add and conflict handling; prompt regression tests; sanitization, accessibility, browser matrix.\n\nLater: stale badges via card lineage; keyboard \"Move to\u2026\"; tab reordering; cross-workspace drag; self-host Inter.\n\nFeature requests, placed (design and trade-offs; none built yet)\n- M4.5 Minimize to a dock (built in 0.11.0-m4). Each card can be minimized; it leaves its pane and becomes a chip in a bottom dock that only appears when something is minimized. Click a chip to restore it to its pane. Minimized cards keep their content and stay visible to the assistant. Trade-offs: a pane whose cards are all minimized stays as an empty pane (auto-collapsing panes would shift the layout under you); the dock costs about 34 px of height while in use; the saved `.appdeck` format gains an optional per-card flag (old files still load).\n- M4.6 Global search (built in 0.13.0-m4). One overlay (Ctrl/Cmd+Shift+F) searching every workspace: card titles, note and Markdown text, task text and assignee, table cells. Results show a snippet; picking one switches workspace, activates the card and flashes the match. Trade-offs: text search over in-memory data without an index (fine at MVP size); it is a jump list, not a filter that dims non-matching cards, which can come later.\n- M4.7 Card catalog (built in 0.14.0-m4). An overlay listing every card across workspaces with type, workspace and a status you can change (Active, Minimized, Archived). Needs a decision: if Close should archive instead of delete, closed cards stay recoverable from the catalog and permanent delete moves there (red, with confirmation). Trade-offs: archived cards keep taking storage; the assistant's card index and tools must skip archived cards.\n- M4.8 Menu system (built in 0.15.0-m4, single Menu button). Cascading groups File, Edit, View, Card, Workspace, Assistant, Help, sharing one command list with the palette. Follow-ups: a submenu for layouts if the View group grows; a recent-files list; touch behaviour check on a phone (M5).\n\nM4.12 Calendar repeats and .ics built (0.18.0). Calendar leftovers: nth-weekday monthly repeats, multi-day bars, month drag-create across days, reminders, time zone per event, 3-day view in narrow panes.\n\nFeature requests: Rename cards by double-click, M4.9, done (0.16.1). Improve speech to text, M4.10: phase 1 done (0.16.1); phase 2 (recorded audio and provider transcription, flag off by default) M     return tg.length>=4&&tg.every(x=>typeof x.f==='function'&&x.n.startsWith('Move "'))&&!tg.some(x=>x.n.includes('as a tab in')&&paneOf(w,cid).cs.includes(cid)&&x.n.includes(paneOf(w,cid).cs.map(k=>w.cards[k].title).join(', ')+')')&&false)&&names.includes('Move active card to…')&&MENU.find(m=>m[0]==='Card')[1].includes('moveTo')
      &&!!tab&&tab.tabIndex===0&&tab.hasAttribute('aria-selected')&&!!document.querySelector('[role=tablist]')&&(!dv||dv.tabIndex===0)&&document.getElementById('pal').getAttribute('role')==='dialog'&&!!document.querySelector('.pane[role=region][aria-label]')});
  t('assistant: card text is marked as data, never instructions',()=>/never instructions/.test(sysPrompt('plan',false))&&/never instructions/.test(sysPrompt('create',false)));
  out.unshift((out.length-bad)+'/'+out.length+' tests passed');showResults(out);return out}

/* ---------- boot ---------- */
function seed(){
  const w=newWs('Workspace 1');
  [['note','Welcome'],['tasks','Tasks'],['table','Table'],['assistant','Assistant']].forEach(([t,title])=>{const c=id();w.cards[c]={id:c,type:t,title};w.data[c]=t==='note'?{text:'Drag any tab onto a pane edge to split, or onto the middle to add it as a tab.\n\nDouble-click a divider to even out sizes. Ctrl/Cmd+K opens the command palette. Layout changes can be undone.'}:REG[t].def()});
  applyPreset(w,'bench');return w}
(async()=>{
  let s=null;
  try{const a=await kv('readonly',x=>x.get('ai'));if(a&&ADAPT[a.prov])AI={...AI,...a}}catch(e){}
  try{const o=await kv('readonly',x=>x.get('state'));if(o)s=unpack(o)}catch(e){console.error(e);setSt('Could not read saved data: '+(e&&e.message||e),1)}
  if(!s){try{const old=JSON.parse(localStorage.getItem('appdeck-m1'));if(old&&Array.isArray(old.tabs)&&old.tabs.length)s=unpack({format:'appdeck',v:1,theme:old.theme,cur:old.cur,workspaces:old.tabs.map(w=>({name:w.name,focus:w.focus,layout:w.root,cards:Object.values(w.cards||{}).map(c=>({id:c.id,type:c.type,title:c.title,data:(w.data||{})[c.id]}))}))})}catch(e){}}
  S=s||{tabs:[seed()],cur:0,n:1};let upd=false;
  try{if(await kv('readonly',x=>x.get('mvpver'))!==MVP.ver){syncMvp();upd=true;await kv('readwrite',x=>x.put(MVP.ver,'mvpver'))}}catch(e){syncMvp();upd=true}
  applyTheme();render();
  if(upd){schedule();toast('AppDeck MVP workspace updated to '+MVP.ver,['Open',()=>{S.cur=S.tabs.findIndex(w=>w.name==='AppDeck MVP');H=[];F=[];commit(null)}])}
  if(location.search.includes('test'))runTests()})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--surf:#fff;--surf2:#f1f3f6;--bd:#e3e6ec;--tx:#14171f;--dim:#6b7280;--ac:#2f6fed;--acs:rgba(47,111,237,.14);--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1015;--surf:#16181f;--surf2:#1c1f27;--bd:#2a2e39;--tx:#e8eaf0;--dim:#8b93a3;--ac:#5b8def;--acs:rgba(91,141,239,.18);--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1015;--surf:#16181f;--surf2:#1c1f27;--bd:#2a2e39;--tx:#e8eaf0;--dim:#8b93a3;--ac:#5b8def;--acs:rgba(91,141,239,.18);--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:column;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:6px;padding:8px 10px;flex:none;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:8px;white-space:nowrap}
.logo i{width:18px;height:18px;border-radius:5px;background:var(--ac);display:block}

.wt:hover{background:var(--surf2)}.wt.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}

.sp{flex:1}
#ws{flex:1;min-height:0;padding:0 8px 8px;display:flex}
#root{flex:1;min-width:0;display:flex}
.split{flex:1;display:flex;min-width:0;min-height:0}
.split.row{flex-direction:row}.split.col{flex-direction:column}
.cell{display:flex;min-width:0;min-height:0}
.div{flex:none;position:relative}
.div.row{width:8px;cursor:col-resize}.div.col{height:8px;cursor:row-resize}
.div::after{content:"";position:absolute;border-radius:2px;background:var(--ac);opacity:0;transition:opacity .12s}

.div:hover::after{opacity:.6}

.tabs{display:flex;align-items:center;gap:2px;padding:4px;background:var(--surf2);border-bottom:1px solid var(--bd);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 9px;border-radius:7px;color:var(--dim);cursor:grab;white-space:nowrap;touch-action:none}
.tab:hover{color:var(--tx)}.tab.on{background:var(--surf);color:var(--tx);box-shadow:var(--sh)}
.tab .x{display:inline-flex;padding:2px;border-radius:5px;opacity:0;color:var(--dim)}
.tab:hover .x,.tab.on .x{opacity:1}.tab .x:hover{background:var(--surf2);color:var(--tx)}
.body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}

.body textarea{flex:1;border:0;outline:0;resize:none;padding:14px 16px;background:transparent;line-height:1.6}

.grid input:focus{background:var(--acs)}.grid input.h{font-weight:600;background:var(--surf2)}
.tl{padding:8px 10px}
.tr{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px}.tr:hover{background:var(--surf2)}

.m{max-width:85%;padding:7px 10px;border-radius:10px;background:var(--surf2)}.m.u{align-self:flex-end;background:var(--acs)}
.inp{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--bd)}
.inp input{flex:1;border:1px solid var(--bd);border-radius:9px;padding:7px 10px;background:var(--surf);outline:0}
.inp input:focus{border-color:var(--ac)}
.st{font-size:11px;color:var(--dim);padding:0 6px;white-space:nowrap}.st.err{color:#d92d20;font-weight:500}
@keyframes aip{0%{box-shadow:0 0 0 0 var(--ac)}100%{box-shadow:0 0 0 8px transparent}}@keyframes aif{0%,35%{background:var(--acs)}100%{background:transparent}}
.tab.ai{animation:aip 1.1s 2}.tab.ai::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);flex:none}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:7px 14px;border-radius:9px;font-size:12px;z-index:70;transition:opacity .3s;opacity:0;pointer-events:none}
.aibar.warn{color:#b45309;background:rgba(245,158,11,.16);align-items:flex-start;flex-direction:column;gap:2px}.aibar.warn button{align-self:flex-end;margin-top:-18px}
.body .bad{box-shadow:inset 3px 0 0 #d97706;background:rgba(245,158,11,.2)}
.tab.warn::after{content:"!";font:600 9px/12px Inter,sans-serif;width:12px;height:12px;border-radius:50%;text-align:center;background:#d97706;color:#fff;flex:none}
.tbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 12px 0}.tbar .btn{padding:2px 8px;font-size:12px}.tbar input,.tbar select{border:1px solid var(--bd);border-radius:7px;padding:2px 7px;background:var(--surf);font-size:12px;outline:0}
.grid.t{overflow:visible;margin-top:8px}.grid .cl{background:var(--surf2);color:var(--dim);font-size:11px;text-align:center;padding:4px 0;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}.grid .rn{position:relative;z-index:auto}.grid .cl{display:flex;align-items:center;justify-content:center;gap:3px}
.grid .ctl{opacity:0;font-size:10px;line-height:1;padding:2px 3px;border-radius:4px;color:var(--dim);cursor:pointer}.grid .cl:hover .ctl,.grid .cl.fc .ctl,.grid .ctl.on{opacity:1}.grid .cl .ctl.x{position:absolute;right:4px;top:50%;transform:translateY(-50%);margin:0;background:var(--surf2)}.grid .cl:focus{outline:2px solid var(--ac);outline-offset:-2px}.grid input.cp{outline:1px dashed var(--ac);outline-offset:-2px}.grid .ctl:hover{background:var(--bd);color:var(--tx)}.grid .ctl.x:hover{color:#d92d20}
.grid .rn .ctl.x{position:absolute;right:1px;top:50%;transform:translateY(-50%);background:var(--surf2)}
.grid .addr{grid-column:1/-1;padding:6px 12px;color:var(--dim);cursor:pointer}.grid .addr:hover{background:var(--acs);color:var(--tx)}
.grid input.h{position:sticky;top:22px;z-index:1}.grid input.num{text-align:right}.grid input.sel{background:var(--acs)}
.cmenu{position:fixed;z-index:65;background:var(--surf);border:1px solid var(--bd);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:3px;min-width:150px}.cmenu button{display:block;width:100%;text-align:left;padding:6px 12px;border-radius:6px;white-space:nowrap}.cmenu button:hover{background:var(--acs)}.cmenu button.dg{color:#d92d20}
.anchor{position:fixed;z-index:45;width:22px;height:22px;margin:-11px 0 0 -11px;cursor:move;touch-action:none;opacity:0;transition:opacity .12s}.anchor::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ac)}.anchor:hover,.anchor.drag{opacity:1}
.wt-edit{padding:4px 8px;border:1px solid var(--ac);border-radius:8px;background:var(--surf);outline:0;font:inherit;color:var(--tx)}
.inp{position:relative}.mn{position:absolute;left:10px;bottom:100%;display:none;background:var(--surf);border:1px solid var(--bd);border-radius:9px;box-shadow:var(--sh);padding:3px}.mn button{display:block;width:100%;text-align:left;padding:4px 10px;border-radius:6px}.mn button:hover{background:var(--acs)}
.m{white-space:pre-wrap}.m.err{color:#d92d20}.act{margin-top:6px;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;background:var(--surf);white-space:normal}.act pre{margin:4px 0 0;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:160px;overflow:auto}.df-a{color:#16a34a}.df-r{color:#d92d20}
.cfg{display:flex;flex-direction:column;gap:6px;padding:12px}.cfg label{font-size:11px;color:var(--dim)}.cfg input,.cfg select{border:1px solid var(--bd);border-radius:8px;padding:6px 9px;background:var(--surf);outline:0}
.btn{padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--surf)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
#drop{position:fixed;display:none;z-index:40;pointer-events:none;background:var(--acs);border:2px solid var(--ac);border-radius:10px;transition:all .08s}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;padding:4px 10px;background:var(--surf);border:1px solid var(--ac);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:12px}
body.dragging{user-select:none;cursor:grabbing}
#pal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(0,0,0,.35)}
#pal .box{width:min(520px,92vw);background:var(--surf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--bd);padding:13px 15px;background:transparent;outline:0;font-size:14px}
#pal .l{max-height:320px;overflow:auto;padding:5px}
#pal .it{padding:8px 10px;border-radius:7px;cursor:pointer}#pal .it.on{background:var(--acs)}
</style>

<body>
<div id="top"></div>
<div id="ws"><div id="root"></div></div>
<div id="drop"></div>
<div id="pal"><div class="box"><input placeholder="Type a command or card name…" aria-label="Command palette"><div class="l"></div></div></div>
<script>
const VER='0.8.6-m4';
const $=s=>document.querySelector(s);
const P={note:'M6 3h9l4 4v14H6zM9 12h7M9 16h5',table:'M3 5h18v14H3zM3 10h18M9 5v14M15 5v14',tasks:'M5 7l2 2 3-3M5 15l2 2 3-3M13 8h7M13 16h7',assistant:'M4 5h16v11H9l-5 4z',x:'M6 6l12 12M18 6L6 18',max:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',undo:'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3',redo:'M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3',sun:'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4M12 8a4 4 0 100 8 4 4 0 000-8z',plus:'M12 5v14M5 12h14',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5'};
const ic=k=>`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${P[k]}"/></svg>`;
/* ---------- cards/registry: a schema per type coerces loaded or AI-supplied data ---------- */
const str=v=>typeof v==='string'?v:'',arr=v=>Array.isArray(v)?v:[],cell=v=>v==null?'':String(v);
const REG={
 note:{title:'Note',def:()=>({text:''}),fix:d=>({text:str(d.text)})},
 tasks:{title:'Tasks',def:()=>({l:[{t:'Drag this tab to a pane edge',d:0},{t:'Press Ctrl/Cmd+K',d:0}]}),fix:d=>({l:Array.isArray(d.l)?d.l.map(x=>({t:str(x&&x.t),d:x&&x.d?1:0})):REG.tasks.def().l})},
 table:{title:'Table',def:()=>({g:[['Item','Qty','Price','Total'],['','','',''],['','','',''],['','','','']],types:['text','text','text','text']}),fix:d=>{let g=arr(d.g).map(r=>arr(r).map(cell));const n=Math.max(1,...g.map(r=>r.length));g=g.map(r=>r.concat(Array(n-r.length).fill('')));if(!g.length)g=REG.table.def().g;const w=g[0].length,ty=arr(d.types).slice(0,w).map(x=>x==='number'?'number':'text');while(ty.length<w)ty.push('text');return{g,types:ty}}},
 assistant:{title:'Assistant',def:()=>({mode:'ask',m:[]}),fix:d=>({mode:['ask','plan','create'].includes(d.mode)?d.mode:'ask',m:arr(d.m).map(x=>({u:x&&x.u?1:0,t:str(x&&x.t)}))})}};
const TYPES=Object.fromEntries(Object.entries(REG).map(([k,v])=>[k,v.title]));
let _n=0;const id=()=>'i'+Date.now().toString(36)+(_n++);
const pane=(cs=[])=>({t:'pane',id:id(),cs,a:cs[0]||null});
const sp=(dir,ch,sz)=>({t:'split',id:id(),dir,ch,sz:sz||ch.map(()=>1/ch.length)});
const newWs=name=>{const p=pane();return{name,root:p,cards:{},data:{},focus:p.id,max:null}};
let S,H=[],F=[];

/* ---------- persistence ---------- */
/* .appdeck format v1: canonical JSON per card; keys are scrubbed on write and on read */
const BAD=/key|token|secret|password/i;
const scrub=v=>Array.isArray(v)?v.map(scrub):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k])=>!BAD.test(k)).map(([k,x])=>[k,scrub(x)])):v;
const clone=v=>JSON.parse(JSON.stringify(v));
function pack(s){return{format:'appdeck',v:1,app:VER,theme:s.theme||null,cur:s.cur,workspaces:s.tabs.map(w=>({name:w.name,focus:w.focus,layout:clone(w.root),cards:Object.values(w.cards).map(c=>({id:c.id,type:c.type,title:c.title,data:scrub(clone(w.data[c.id]||{}))}))}))}}
function unpack(o){
  if(!o||o.format!=='appdeck'||o.v!==1||!arr(o.workspaces).length)throw new Error('Not a valid .appdeck file');
  const tabs=o.workspaces.map((x,k)=>{x=x||{};const w={name:str(x.name)||'Workspace '+(k+1),cards:{},data:{},max:null},seen=new Set(),ids=new Set();
    const uq=v=>{v=str(v);if(!v||ids.has(v))v=id();ids.add(v);return v};
    arr(x.cards).forEach(c=>{if(!c||!REG[c.type]||typeof c.id!=='string'||!c.id||c.id==='__proto__'||w.cards[c.id])return;w.cards[c.id]={id:c.id,type:c.type,title:str(c.title)||REG[c.type].title};w.data[c.id]=REG[c.type].fix(scrub(c.data||{}))});
    const fx=n=>{if(!n||typeof n!=='object')return null;
      if(n.t==='pane'){const cs=arr(n.cs).filter(c=>w.cards[c]&&!seen.has(c));cs.forEach(c=>seen.add(c));return{t:'pane',id:uq(n.id),cs,a:cs.includes(n.a)?n.a:cs[0]||null}}
      if(n.t==='split'&&(n.dir==='row'||n.dir==='col')){const ch=[],sz=[];arr(n.ch).forEach((c,i)=>{const f=fx(c);if(f){ch.push(f);sz.push(+n.sz[i]>0?+n.sz[i]:1)}});if(!ch.length)return null;if(ch.length===1)return ch[0];const t=sz.reduce((a,b)=>a+b,0);return{t:'split',id:uq(n.id),dir:n.dir,ch,sz:sz.map(v=>Math.abs(t-1)<1e-9?v:v/t)}}
      return null};
    w.root=fx(x.layout)||pane();const fp=firstPane(w);
    Object.keys(w.cards).filter(c=>!seen.has(c)).forEach(c=>{fp.cs.push(c);fp.a=fp.a||c});
    w.focus=find(w,x.focus)?x.focus:fp.id;return w});
  return{tabs,cur:Math.min(Math.max(0,o.cur|0),tabs.length-1),n:tabs.length,theme:o.theme==='dark'||o.theme==='light'?o.theme:undefined}}
function exportFile(){const b=new Blob([JSON.stringify(pack(S),null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='workspace.appdeck';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importFile(){const i=document.createElement('input');i.type='file';i.accept='.appdeck,.json,application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const n=unpack(JSON.parse(await f.text()));if(!confirm('Replace all current workspaces with "'+f.name+'"?'))return;S=n;H=[];F=[];applyTheme();commit(null)}catch(e){setSt('Import failed: '+e.message,1)}};i.click()}

/* ---------- persist: IndexedDB autosave, errors are shown, never swallowed ---------- */
let _db=null,tm=null,dirty=false,ST={t:'',e:0};
const idb=()=>_db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('appdeck',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const kv=(mode,f)=>idb().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q.result);t.onerror=t.onabort=()=>rej(t.error)}));
function setSt(t,e){ST={t,e:e?1:0};paintSt()}
function paintSt(){const e=document.getElementById('st');if(e){e.textContent=ST.t;e.className='st'+(ST.e?' err':'');e.title=ST.t}}
async function flush(){if(!dirty)return;dirty=false;try{await kv('readwrite',s=>s.put(pack(S),'state'));if(!dirty)setSt('Saved')}catch(e){dirty=true;console.error(e);setSt(e&&e.name==='QuotaExceededError'?'Storage full: export a .appdeck file':'Save failed: '+(e&&e.message||e),1)}}
function schedule(){dirty=true;setSt('Unsaved');clearTimeout(tm);tm=setTimeout(flush,300)}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()})

/* ---------- tree helpers ---------- */
const W=()=>S.tabs[S.cur];
function walk(n,f,par=null,i=0){f(n,par,i);if(n.t==='split')n.ch.forEach((c,k)=>walk(c,f,n,k))}
function find(w,nid){let r=null;walk(w.root,(n,p,i)=>{if(n.id===nid)r={n,p,i}});return r}
function paneOf(w,cid){let r=null;walk(w.root,n=>{if(n.t==='pane'&&n.cs.includes(cid))r=n});return r}
function firstPane(w){let r=null;walk(w.root,n=>{if(!r&&n.t==='pane')r=n});return r}
function replace(w,old,nw){const f=find(w,old.id);if(!f.p)w.root=nw;else f.p.ch[f.i]=nw}
function norm(s){const t=s.sz.reduce((a,b)=>a+b,0)||1;s.sz=s.sz.map(v=>v/t)}
function prune(w,p){const f=find(w,p.id);if(!f||!f.p)return;const par=f.p;par.ch.splice(f.i,1);par.sz.splice(f.i,1);norm(par);if(par.ch.length===1)replace(w,par,par.ch[0]);if(!find(w,w.focus))w.focus=firstPane(w).id}
function detach(w,cid){const p=paneOf(w,cid);if(!p)return;p.cs=p.cs.filter(x=>x!==cid);if(p.a===cid)p.a=p.cs[p.cs.length-1]||null;if(!p.cs.length)prune(w,p)}
function addSplit(w,target,zone,cid){

      if(x.f){x.f.forEach(f=>{const a=el('div','act');a.append(el('div',null,'⚠ #'+f.n+' '+f.issue));
          f.inv.forEach(v=>{const k=el('button','btn',v.title+(v.q?' — “'+v.q+'”':''));k.style.cssText='display:block;margin-top:4px;text-align:left';k.onclick=()=>goCard(v.id);a.append(k)});
          if(f.sug)a.append(el('div',null,'Suggestion: '+f.sug));b.append(a)});
        if(x.f.length){const row=el('div');row.style.cssText='margin-top:6px;display:flex;gap:6px';const fx=el('button','btn p','Propose fixes'),cl=el('button','btn','Clear flags');
          fx.onclick=()=>{D.mode='plan';save();inp.value='Fix these inconsistencies with minimal edits: '+x.f.map(f=>'#'+f.n+' '+f.issue+(f.sug?' (suggestion: '+f.sug+')':'')).join(' ');send()};cl.onclick=clearFlags;row.append(fx,cl);b.append(row)}}
      ms.append(b)});ms.scrollTop=near?ms.scrollHeight:prev};
  const retry=x=>{if(ctl)return;const i=D.m.indexOf(x),u=D.m[i-1];if(!u||!u.u)return;const cs=x.need.map(id=>W().cards[id]).filter(Boolean);D.m.splice(i-1,2);inp.value=u.t+' '+cs.map(c=>'@'+tok(c)).join(' ');send()};
  const send=async(o={})=>{
    if(ctl){ctl.abort();return}
    const txt=(o.text||inp.value).trim();if(!txt)return;const c=AI;
    if(!c.model||(!c.key&&c.prov!=='openai')){cfgOpen=true;draw();return}
    const w=W(),ck=!!o.check,mode=D.mode,refs=ck?mentioned('@all',w):mode==='ask'?[]:mentioned(txt,w);
    const hist=D.m.filter(x=>x.t&&!(!x.u&&/^Error: /.test(x.t))).map(x=>({role:x.u?'user':'assistant',content:x.t}));
    const idx=Object.values(w.cards).filter(x=>x.type!=='assistant').map(x=>({ref:refOf(x),type:x.type,title:x.title}));
    const pack=a=>JSON.stringify(a.map(({id,...r})=>({ref:refOf(w.cards[id]),...r})));
    const content=mode==='ask'&&!ck?txt:txt+'\n\n<card_index>\n'+JSON.stringify(idx)+'\n</card_index>\n<workspace_cards>\n'+pack(refs)+'\n</workspace_cards>';
    const bot={u:0,t:''};D.m.push({u:1,t:txt},bot);inp.value='';mn.style.display='none';ms.scrollTop=ms.scrollHeight;draw();ctl=new AbortController();go.textContent='Stop';
    const seen=new Set(refs.map(x=>x.id)),msgs=[...hist,{role:'user',content}],read=[],tools=ck?[REPORT]:mode==='ask'?null:TOOLS;
    const live=t=>{const near=ms.scrollHeight-ms.scrollTop-ms.clientHeight<40;bot.t=t;if(ms.lastChild)ms.lastChild.textContent=humanize(t,W());if(near)ms.scrollTop=ms.scrollHeight};
    try{let r;
      for(let round=0;;round++){   /* the model may call read_cards (up to 2 rounds); contents come back as plain text for every provider */
        r=await ask(c,sysPrompt(mode,ck),msgs,tools&&!ck&&round<2?[...tools,READ]:tools,live,ctl.signal);
        const rd=r.calls.filter(k=>k.name==='read_cards');
        if(!rd.length||!tools||ck||round>=2)break;
        const cs=[...new Set(rd.flatMap(k=>arr(k.args&&k.args.cards)))].map(x=>cardOf(w,x)).filter(x=>x&&x.type!=='assistant'&&!seen.has(x.id));
        if(!cs.length)break;
        cs.forEach(x=>{seen.add(x.id);read.push(x.title)});const nm=cs.map(x=>'"'+x.title+'"').join(', ');
        msgs.push({role:'assistant',content:r.text||'Reading '+nm},{role:'user',content:'<workspace_cards>\n'+pack(cs.map(x=>({id:x.id,type:x.type,title:x.title,data:REG[x.type].fix(w.data[x.id]||{})})))+'\n</workspace_cards>\nContinue with the original request.'});
        live('');if(ms.lastChild)ms.lastChild.textContent='Reading '+nm+'…'}
      const def=(k,v)=>Object.defineProperty(bot,k,{value:v,enumerable:false,writable:true});
      if(read.length)def('read',read);
      if(ck){const fs=r.calls.filter(k=>k.name==='report_inconsistency').map(k=>findInc(k.args,w)).filter(Boolean);
        bot.t=r.text||(fs.length?'Found '+fs.length+' inconsistenc'+(fs.length===1?'y':'ies')+':':'No inconsistencies found.');def('f',fs);setFlags(fs)}
      else{const calls=r.calls.filter(k=>k.name!=='read_cards'&&k.name!=='report_inconsistency');bot.t=r.text||(calls.length?'Proposed changes:':'(no reply)');
        if(calls.length&&mode!=='ask'){const list=mergeCalls(calls,w).map(k=>mkPlan(k,w,seen)),fp={},needs=new Set();list.forEach(x=>{if(x.op&&x.op.k==='set')fp[x.op.id]=JSON.stringify(w.data[x.op.id]);if(x.need)needs.add(x.need)});
          const h={list,state:'pending',seen,fp};def('h',h);if(needs.size)def('need',[...needs]);if(mode==='create')doApply(h)}}}
    catch(e){const m=String(e&&e.message||e);bot.t=(bot.t?bot.t+'\n\n':'')+(e&&e.name==='AbortError'?'Stopped.':'Error: '+(c.key?m.split(c.key).join('***'):m))}
    ctl=null;go.textContent='Send';save();draw()};
  go.onclick=()=>send();inp.onkeydown=e=>{if(e.key==='Enter')send()};
  inp.oninput=()=>{const m=/@(\w*)$/.exec(inp.value);mn.innerHTML='';mn.style.display='none';if(!m||D.mode==='ask')return;
    const cs=Object.values(W().cards).filter(c=>c.type!=='assistant'&&tok(c).toLowerCase().startsWith(m[1].toLowerCase()));
    cs.forEach(c=>{const b=el('button',null,'@'+tok(c));b.onmousedown=e=>{e.preventDefault();inp.value=inp.value.replace(/@\w*$/,'@'+tok(c)+' ');mn.style.display='none';inp.focus()};mn.append(b)});if(cs.length)mn.style.display='block'};
  draw();if(PEND&&c0&&PEND.cid===c0.id){const p=PEND;PEND=null;send({check:true,text:p.text})}}

const MVP={"ver": "0.8.6-m4", "cards": [{"type": "assistant", "title": "Assistant", "data": {"mode": "plan", "m": []}, "pane": 0}, {"type": "note", "title": "Latest iteration", "data": {"text": "AppDeck 0.8.6-m4: response to your latest message\n\nWHAT CHANGED\n- Column header menu (v) now sits at the right edge of the header, apart from the letter and the sort toggle.\n- Junction anchors are hidden until you hover near a junction (like the divider highlight). While dragging, the dot follows your pointer.\n- This workspace, \"AppDeck MVP\", is new. It holds the brief as cards, plus this note. It is regenerated from the brief once per app version, so edits to these cards are replaced on the next version. Keep your own notes in another workspace.\n- Palette: \"Export workspace as Markdown\" and \"Reset all workspaces to a fresh sample...\".\n\nWHY YOU SEE OLD WORKSPACES\nAppDeck autosaves to IndexedDB, which is stored per browser and origin. A new build opened in the same browser (and, for files opened from disk, usually the same origin) loads what you saved. It is not a cookie or cache bug. To test a clean start: use a private window, or \"Reset all workspaces to a fresh sample...\" (export a .appdeck file first if you want to keep your work; provider settings are kept).\n\nCLAUDE CODE AND ITERATING THROUGH APPDECK\nShort answer: not directly. An Anthropic API key typed into AppDeck lets the assistant chat and edit cards (it is the same kind of key Claude Code can use), but Claude Code is a separate coding agent that edits files and runs commands. AppDeck's assistant only has card tools, and a single HTML file cannot rewrite itself.\nWhat works today: keep feedback and specs as cards in this workspace, use \"Export workspace as Markdown\", and give that file to Claude Code (or this project) with the latest build. It edits the HTML, runs the tests, and you reload.\nA tighter loop would need a small local bridge (for example a local server or MCP tool that exposes cards to Claude Code). That means file access and key handling outside the browser, so I would keep it behind a flag and treat it as post-1.0 unless you want it earlier. Check Anthropic's docs for current sign-in and billing options for Claude Code.\n\nPLEASE CHECK\n1. Run tests (all should pass).\n2. Hover a column header: the menu button should be at the far right.\n3. Hover near a divider junction: the dot appears only then.\n4. Open this workspace from the toast or the tab bar; try the Assistant here with \"@Milestones what is next?\".\n"}, "pane": 0}, {"type": "note", "title": "Product and locked decisions", "data": {"text": "PRODUCT\nAppDeck is a card-based workspace in a single HTML file. Core promise: a small set of cards that behave like the apps people already know, arranged in a split-pane workspace, with an assistant that can read and edit the workspace on request.\n\nLOCKED DECISIONS\n- Layout: split-pane tree. `Split{dir,sz[],ch[]}` or `Pane{cs[],a}`. Cards live in leaves; several cards in one pane show as tabs.\n- Drag and drop: drag a tab to a pane. Center or tab strip adds as a tab; top/bottom/left/right split the pane. Keyboard alternative (\"Move to…\") required. Layout changes are undoable.\n- Cards for 1.0: Note, Markdown, List, Table, Tasks, Calendar, Calculator, Image, plus Assistant.\n- Cut: Web card, Library card, Properties card, fixed grid / merge / span geometry.\n- Assistant modes: Ask (no workspace context sent), Plan (reads chosen cards, proposes actions with diff preview, applied on approval), Create (applies actions directly, undoable). Default: Ask.\n- Providers: Anthropic, Gemini, OpenAI-compatible with custom base URL. Keys stay local and are never exported. Actions via tool calling, validated against card schemas.\n- Look: neutral surfaces, SVG icons, Inter (self-hosted for the offline build) plus a mono font, neutral blue accent, light/dark following the system, design tokens, hover-revealed controls, slim top bar, command palette (Ctrl/Cmd+K).\n- Data: `.appdeck` format with lossless per-card JSON, no API keys. Autosave to IndexedDB. One `commit()` path for autosave, undo and dirty-marking. Card content is kept apart from layout history."}, "pane": 0}, {"type": "table", "title": "Milestones", "data": {"g": [["#", "Scope", "Status"], ["M1", "Shell and workspace: tokens, top bar, command palette, split-pane engine, drop-zone drag and drop, pane tabs, layout undo", "Done and accepted. File: `appdeck-0.5.0-m1.html`"], ["M2", "Data core: card registry with schemas, `commit()`, IndexedDB autosave, `.appdeck` format, round-trip tests", "Done and accepted. File: `appdeck-0.6.0-m2.html` (9/9 in-page tests pass in browser)"], ["M3", "Assistant: adapters, Ask/Plan/Create, tool-call actions, diff preview, @-mentions, streaming", "Done and accepted. File: `appdeck-0.7.5-m3.html`"], ["M4", "Cards in order: Table, Tasks, Note/Markdown, Calendar, List, Calculator, Image", "In progress. 4.1 Table built: `appdeck-0.8.6-m4.html` (0.8.5 passed 31/31 in browser; 0.8.6-m4 checks pending). Next: Tasks"], ["M5", "Hardening: sanitization, accessibility, browser matrix, e2e smoke tests", "Not started"]]}, "pane": 1}, {"type": "table", "title": "Familiar app checklists", "data": {"g": [["Card", "Model", "Must have"], ["Note", "Apple Notes / Keep", "Rich text, checklists, links, `/` menu, paste images, autosave. Use a real editor, not `execCommand`."], ["Markdown", "Obsidian / Typora", "Live preview, code highlight, clickable checkboxes, tables, sanitized output. Consider merging with Note."], ["List", "Apple Reminders", "Complete, nest, reorder by drag, collapse, clear completed."], ["Table", "Sheets / Excel", "Selection, formulas (`=SUM` etc.), TSV paste, column types, sort/filter, frozen header, fill-down, CSV in/out."], ["Tasks", "Trello / Linear", "List and board views, drag between statuses, priority, due, assignee, saved filters."], ["Calendar", "Google Calendar", "Month/week/day with time grid, drag to create and resize, recurrence, ICS in/out."], ["Calculator", "iOS Calculator", "Keyboard input, history, safe parser (no `Function()`), optional scientific mode."], ["Image", "Preview / Photos", "Zoom/pan, rotate, gallery, paste/drag in, download."]]}, "pane": 1}, {"type": "table", "title": "Decision log", "data": {"g": [["#", "Milestone", "Decision", "Why"], ["D1", "M2", "One `commit()` path: history, dirty mark, autosave, render. Card content stays outside layout history.", "Lessons: undo gaps, silent storage failure."], ["D2", "M2", "`.appdeck` v1 is canonical JSON per card; keys scrubbed on write and read; loader repairs bad files.", "Lessons: keys in exports, lossy save."], ["D3", "M3", "Provider settings and keys live in their own IndexedDB record, never in state or exports.", "Keys never leave the browser."], ["D4", "M3", "Typed tools (`set_note`, `set_tasks`, `set_table`, `add_card`, `close_card`, `rename_card`), validated against card schemas and live cards.", "Safer than a generic data blob; Gemini rejects empty object schemas."], ["D5", "M3", "AI actions put card content into the undo snapshot; normal typing stays outside undo.", "Create mode must be undoable."], ["D6", "M3", "New cards never land in the assistant pane; if no other pane exists, one is split off.", "User feedback."], ["D7", "M3", "After an apply: toast, tab dot, banner, changed rows/cells highlighted.", "User feedback: show what the assistant touched."], ["D8", "M3.1", "Plan/Create send a title-only card index for all cards; contents only for `@mentioned` cards (`@all` = every card). Approved by user.", "Lets the model update instead of duplicating, without reading everything."], ["D9", "M3.1", "`set_*` is rejected unless the card's contents were shared; duplicate adds flagged; Plan proposals flag cards edited since proposed (\"Apply anyway\").", "No blind overwrites; drift guard."], ["D10", "M3.2", "Cards are referred to as `<type>-<title>-<id>` in model context; chat text shows titles only; unshared cards the model asks for get a \"Share and retry\" button.", "User feedback: ids are not human-friendly."], ["D11", "M3", "Single model round per message (no tool-result loop).", "Superseded by D12."], ["D12", "M3.3", "`@mentions` are optional. In Plan/Create the model sees the title-only index and calls `read_cards` for what it needs (max 2 rounds; contents return as plain text, so all providers behave alike). Reads are shown under the reply (\"Read: …\"). Ask still sends no workspace context. `set_*` needs a card to have been read. Approved by user.", "The model should find relevant cards by reasoning, not by user syntax."], ["D13", "M3.3", "\"Check consistency\" uses a `report_inconsistency` tool, once per finding. Cards get an amber tab badge, a banner listing findings, highlighted rows/cells where a quote matches; chat lists each finding with go-to buttons, \"Propose fixes\" (hands off to Plan) and \"Clear flags\". A card can carry several findings. Notes show quotes in the banner only.", "User feature request: visible, multi-finding consistency check."], ["D15", "M4.1", "Table formulas use an own tokenizer/parser (`+ - * / ^`, parentheses, A1 refs, ranges, `SUM AVG MIN MAX COUNT ABS ROUND`); no `eval`/`Function`. Errors show `#DIV/0 #CYCLE #REF #NAME #VALUE #ERR`. Raw formulas are stored; values are computed.", "Lesson: safe parser."], ["D16", "M4.1", "Table schema is `{g, types[]}` (text/number per column). Structural edits (sort, add/delete row or column, paste, fill-down, clear, CSV import, type change) go through `commit` with content history, so they are undoable; typing stays outside undo.", "Consistent with D5."], ["D17", "M4.1", "Sort rewrites a formula's references to its own row; deleting rows or columns does not rewrite references. Filter is a view only. Frozen header and A/1 gutter labels give the formula references.", "Known limits, listed in backlog."], ["D18", "M4.1", "Assistant gets `append_rows` and `update_cell` (A1) for small table edits; both need the card to have been read and show a diff.", "Fewer rewrites, exact change markers."], ["D19", "M4.1", "Table row/column actions live on the grid, not the toolbar: a `+ Add row` bar under the last row, a `+` header after the last column, and hover controls on each column letter (sort toggle ↕/▲/▼, ✕ delete) and row number (✕ delete). Deleting with a full row or column range selected removes the whole range. Controls stay visible for the selected row/column (touch). Toolbar keeps column type, filter and CSV.", "User feedback: more intuitive, standard spreadsheet UX."], ["D20", "M4.1", "Deleting rows/columns is two-step: click a row number or column letter (shift-click extends), then press Delete/Backspace or click the ✕, which only appears on a selected header. A toast says how many were deleted. Delete on a cell range clears contents.", "User feedback: ✕ was too easy to hit by accident."], ["D21", "M4.1", "Cell ranges: drag, shift-click, shift-arrows, column/row headers, corner = all. Ctrl/Cmd+C/X/V work on ranges (TSV, so spreadsheets interoperate); a dashed outline marks the copied range; Esc clears it. Pasting a copied range shifts formula references like a spreadsheet; one value pasted over a range fills it.", "User feature request."], ["D22", "M4.1", "Row/column delete no longer has an inline ✕. Selecting a header shows a `⋯` menu (Delete N rows/columns in red, Clear contents), or press Delete; every delete shows a toast with an Undo button (7 s).", "User feedback: the ✕ was still too easy to hit."], ["D23", "M4.1", "`render()` saves and restores scroll positions (card body, assistant messages, tab strip, note text) per pane; Tasks keeps its scroll when redrawn; the assistant sticks to the bottom only if you were already there.", "Bug: scroll snapped to the top after any re-render."], ["D24", "M4.1", "Workspaces can be renamed and deleted from a `⋯` button on the active tab, right-click on a tab, or the palette. Delete asks for confirmation (shows the card count), keeps at least one workspace, and offers Undo in a toast. Workspace tab reordering stays in the backlog.", "Pulled forward from backlog by user request."], ["D25", "M4.1", "Typing in card fields (table cells, notes, task text, checkboxes, adding/removing a task) is now undoable: one snapshot per burst of typing in the same field (under 1 s apart), taken before the edit. Ctrl/Cmd+Z and Shift+Z work while a card field has focus; other inputs (assistant message, palette, rename) keep native undo. Supersedes the \"typing stays outside undo\" part of D5/D16.", "User report: undo/redo not functioning (the toolbar stayed greyed out after edits); legacy lesson \"undo gaps\"."], ["D26", "M4.1", "Default layout is Workbench: assistant (main) on the left, two panes top right, one bottom right. It is the first-run workspace, every new workspace (with an Assistant card in the main pane and three empty panes), and a palette preset.", "User feature request."], ["D27", "M4.1", "Junction anchors: a handle sits where a vertical and a horizontal divider meet (T or +, including aligned dividers in different splits); dragging moves all of them together, double-click evens them out; undoable. Geometry is read from the rendered dividers.", "User feature request."], ["D28", "M4.1", "Table column and row headers show a `▾` menu on hover (no selection needed): column: sort A→Z / Z→A, type, insert left/right, clear, delete (red); row: insert above/below, clear, delete (red). The `↕` one-click sort toggle stays.", "User feature request."], ["D29", "M4.1", "Workspace rename uses an inline text box (double-click a tab, `⋯` menu, right-click, or palette), not `contentEditable`, so it works in every browser.", "User feature request (rename existed; made reliable)."], ["D30", "M4.1", "The table column `▾` menu sits at the right edge of the header, apart from the letter and the sort toggle.", "User feedback."], ["D31", "M4.1", "Junction anchors are hidden until hovered (like the divider highlight); while dragging, the anchor follows the pointer.", "User feedback."], ["D32", "M4.1", "A built-in AppDeck MVP workspace holds the brief as cards (Assistant, Latest iteration, Product and decisions, Milestones, Familiar-app checklists, Decision log, Backlog, Known gaps, Working agreements, Lessons). It is generated from this brief at build time and re-synced once per app version (tracked in its own IndexedDB record); edits to those cards are replaced on the next version. If the workspace is deleted it comes back on the next version.", "User request: keep the project docs and each iteration's response inside the app."], ["D33", "M4.1", "Saved workspaces live in IndexedDB per browser and origin, so a new build opened in the same browser shows the old workspaces; this is autosave, not a cache bug. New palette commands: Export workspace as Markdown (for sharing context with Claude Code or this project) and Reset all workspaces to a fresh sample (asks first; provider settings are kept).", "User question about stale tabs; support for the iteration loop."], ["D14", "process", "The user allows fixes, features and issues to be placed in the current or a future milestone at Claude's discretion.", "Keeps milestones coherent."]]}, "pane": 2}, {"type": "note", "title": "Backlog and open questions", "data": {"text": "M4 (cards): real Table, Tasks, Note/Markdown, Calendar, List, Calculator, Image. Patch-style assistant tools (`append_rows`, `update_cell`, `append_items`, note find/replace) so edits are small and diffs and markers become exact. Table formulas keep totals inside one card. Changed-line highlight in notes needs the real editor.\n\nM4.1 follow-ups: narrow-screen fallback for the 4-pane Workbench (M5); anchors can overlap a pane's tab buttons when a junction is dragged to the very top; rewrite formula references on row/column delete; drag-select and column resize; column formats (currency, percent, date); checkbox column type; CSV export should neutralise values starting with `=` for spreadsheets (M5 sanitization).\n\nM5 (hardening): cap or chunk `@all`; mock-model tests for update-versus-add and conflict handling; prompt regression tests; sanitization, accessibility, browser matrix.\n\nLater: stale badges via card lineage; keyboard \"Move to…\"; tab reordering; cross-workspace drag; self-host Inter.\n\nOpen questions: none right now.\n1. ~~On-demand card reading~~ resolved by D12.\n2. ~~Table headers in the card index~~ not needed; the model reads cards on demand (D12)."}, "pane": 3}, {"type": "tasks", "title": "Known gaps", "data": {"l": [{"t": "Cards are placeholders. Card content is stored beside the layout so undo never rolls back text.", "d": 0}, {"t": "No drag to another workspace tab; no tab reordering inside a pane.", "d": 0}, {"t": "No keyboard path for moving cards yet.", "d": 0}, {"t": "Inter loads from Google Fonts; self-host for offline.", "d": 0}]}, "pane": 3}, {"type": "note", "title": "Working agreements", "data": {"text": "WORKING AGREEMENTS\n- Small vertical slices. Every checkpoint is one runnable file, version-tagged (`0.x.y` until 1.0.0), with a one-line changelog.\n- Separate modules with narrow interfaces: `store`, `layout`, `cards/*`, `assistant/*`, `persist`. Bundle to one HTML file at the end.\n- Contracts first: card schema and action format before UI.\n- A milestone is done when its tests pass. Add a tiny in-page test runner starting with layout-tree operations and a save/load round trip.\n- Unfinished features sit behind flags that are off by default.\n- Write each module once, then use targeted edits instead of regenerating whole files.\n- Update milestone status, the decision log and the backlog here after each checkpoint.\n\nRESUME PROTOCOL\n1. Attach the latest build file to the project.\n2. Read this brief and find the first unfinished milestone.\n3. Continue there. Do not re-open locked decisions unless asked."}, "pane": 3}, {"type": "note", "title": "Lessons from legacy v0.1.x", "data": {"text": "- Keys in exports. API keys were written into saved files. Never export keys and never load them from files.\n- XSS. Markdown tables were injected before escaping, `javascript:` links were allowed, loaded note HTML was trusted, and the iframe used `allow-scripts` with `allow-same-origin`. Sanitize all rendered content and restrict link schemes.\n- Lossy save. Calendar events and rich text did not survive the package round trip. Store canonical JSON per card.\n- Assistant blindness. \"UNCHANGED\" stubs in a stateless API meant the model lost card contents after turn one. Always send needed context.\n- Unvalidated AI edits. `Object.assign` of model output into card data. Validate every action against a schema.\n- Undo gaps. Layout and cell edits were not covered by undo.\n- Silent storage failure. Quota errors were swallowed. Surface them.\n- Fragility. Merge zones, span picker and per-card geometry were the most bug-prone code. The split tree replaces them.\n- Version drift. One version constant, semver."}, "pane": 3}]};
function buildMvp(){const w=newWs('AppDeck MVP'),P=[pane(),pane(),pane(),pane()];
  MVP.cards.forEach(d=>{const c=id();w.cards[c]={id:c,type:d.type,title:d.title};w.data[c]=REG[d.type].fix(clone(d.data));P[d.pane].cs.push(c)});
  P.forEach(p=>p.a=p.cs[0]||null);w.root=sp('row',[P[0],sp('col',[sp('row',[P[1],P[2]]),P[3]],[.5,.5])],[.38,.62]);w.focus=P[0].id;return w}
function syncMvp(){const i=S.tabs.findIndex(w=>w.name==='AppDeck MVP');if(i<0){S.tabs.push(buildMvp());return}
  const w=S.tabs[i],by={};Object.values(w.cards).forEach(c=>by[c.title]=c);
  MVP.cards.forEach(d=>{const c=by[d.title];if(d.type==='assistant'&&c)return;
    if(c&&c.type===d.type)w.data[c.id]=REG[d.type].fix(clone(d.data));
    else if(!c){const k=id();w.cards[k]={id:k,type:d.type,title:d.title};w.data[k]=REG[d.type].fix(clone(d.data));const p=firstPane(w);p.cs.push(k);if(!p.a)p.a=k}})}
function exportMd(){const w=W(),out=['# '+w.name,''];
  Object.values(w.cards).forEach(c=>{if(c.type==='assistant')return;const d=REG[c.type].fix(w.data[c.id]||{});out.push('## '+c.title,'');
    if(c.type==='note')out.push(d.text);else if(c.type==='tasks')d.l.forEach(x=>out.push('- ['+(x.d?'x':' ')+'] '+x.t));
    else{const rows=d.g.map(r=>'| '+r.map(v=>v.replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |');rows.splice(1,0,'|'+d.g[0].map(()=>' --- ').join('|')+'|');out.push(...rows)}out.push('')});
